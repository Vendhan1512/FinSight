[project]
name = "finsight"
version = "0.1.0"
description = "FinSight Data Science and ML Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Data Science Team" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
